<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#4f46e5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Shifts" />
  <link rel="apple-touch-icon" href="./icons/icon.svg" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./styles.css" />
  <title>Shift Tracker</title>
</head>
<body>
  <main class="app">
    <header class="header">
      <h1>Shift Tracker</h1>
      <button id="settingsBtn" class="icon-btn" aria-label="Settings">⚙️</button>
    </header>

    <!-- Punch card -->
    <section class="card punch-card">
      <p class="status-label">Status</p>
      <p id="statusText" class="status-text">Punched out</p>
      <p id="liveTimer" class="live-timer" hidden>00:00:00</p>
      <button id="punchBtn" class="punch-btn punch-in">Punch In</button>
      <p id="punchHint" class="hint"></p>
    </section>

    <!-- Biweekly summary -->
    <section class="card">
      <div class="row between">
        <h2>This Pay Period</h2>
        <div class="period-nav">
          <button id="prevPeriod" class="icon-btn" aria-label="Previous period">‹</button>
          <button id="nextPeriod" class="icon-btn" aria-label="Next period">›</button>
        </div>
      </div>
      <p id="periodRange" class="muted small"></p>
      <p id="periodTotal" class="big-number">0.00 <span>hrs</span></p>
      <div id="weekBreakdown" class="week-breakdown"></div>
    </section>

    <!-- Shift history -->
    <section class="card">
      <div class="row between">
        <h2>Shifts</h2>
        <button id="addManualBtn" class="text-btn">+ Add</button>
      </div>
      <div id="shiftList" class="shift-list"></div>
      <p id="emptyState" class="muted small center" hidden>No shifts in this period yet.</p>
    </section>

    <footer class="footer">
      <button id="exportBtn" class="text-btn">Export CSV</button>
    </footer>
  </main>

  <!-- Settings dialog -->
  <dialog id="settingsDialog" class="dialog">
    <form method="dialog" class="dialog-form">
      <h2>Settings</h2>
      <label>
        Pay period start date
        <input type="date" id="periodStartInput" required />
        <span class="hint">Anchor date for biweekly periods (any past pay period start).</span>
      </label>
      <label>
        Round to nearest (minutes)
        <select id="roundingInput">
          <option value="1">No rounding</option>
          <option value="5">5 min</option>
          <option value="6">6 min (1/10 hr)</option>
          <option value="15">15 min</option>
        </select>
      </label>
      <div class="dialog-actions">
        <button value="cancel" class="text-btn">Cancel</button>
        <button id="saveSettings" value="save" class="punch-btn small">Save</button>
      </div>
    </form>
  </dialog>

  <!-- Edit shift dialog -->
  <dialog id="editDialog" class="dialog">
    <form method="dialog" class="dialog-form">
      <h2 id="editTitle">Edit Shift</h2>
      <input type="hidden" id="editId" />
      <label>Start
        <input type="datetime-local" id="editStart" required />
      </label>
      <label>End
        <input type="datetime-local" id="editEnd" />
        <span class="hint">Leave blank if still in progress.</span>
      </label>
      <label>Note
        <input type="text" id="editNote" maxlength="120" placeholder="Optional" />
      </label>
      <div class="dialog-actions">
        <button type="button" id="deleteShift" class="text-btn danger">Delete</button>
        <span class="spacer"></span>
        <button value="cancel" class="text-btn">Cancel</button>
        <button id="saveShift" value="save" class="punch-btn small">Save</button>
      </div>
    </form>
  </dialog>

  <script src="./app.js"></script>
</body>
</html>
